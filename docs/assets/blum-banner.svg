  <g font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="718" y="80" width="164" height="46" rx="8" fill="#111a23" stroke="#354351"/>
    <text x="800" y="109" fill="#d5dee8">EVIDENCE</text>
