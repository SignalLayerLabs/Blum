[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blum-research"
version = "3.0.0"
description = "Reproducible financial research and paper portfolios"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6", "uvicorn==0.34.0", "pydantic==2.10.4", "starlette==0.41.3",
  "sqlalchemy>=2.0.36,<2.1", "psycopg[binary]>=3.2,<4",
  "numpy>=1.26.4,<3", "scipy>=1.14,<2", "httpx==0.28.1"
]

[project.optional-dependencies]
native = ["nautilus_trader==1.230.0"]
history = ["yfinance>=0.2.54,<1", "exchange_calendars>=4.13,<5"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
blum = "blum_v3.cli:main"

[tool.setuptools.packages.find]
include = ["blum_v3*"]
