name: Verify BLUM
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: HF Space card contract
        run: python scripts/check_space_metadata.py
          cache: pip
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - name: Backend and migration contracts
        env:
          PYTHONPATH: backend
        run: python -m pytest -q --tb=short
      - name: Packaged historical data quality
        env:
          PYTHONPATH: backend
        run: python scripts/audit_historical_sources.py --check > historical-data-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-data-audit
          path: historical-data-audit.json
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --workspaces=false
      - run: npm --prefix frontend test
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm --prefix frontend run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: frontend/out
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci --prefix cloudflare
      - run: npm --prefix cloudflare test
      - run: npm --prefix cloudflare run types
      - run: npm --prefix cloudflare run typecheck
