name: Verify Blum v3
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  financial-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blum_v3_test
          POSTGRES_USER: blum
          POSTGRES_PASSWORD: ephemeral_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U blum -d blum_v3_test'
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      BLUM_TEST_POSTGRES_URL: postgresql://blum:ephemeral_ci_only@localhost:5432/blum_v3_test
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: python -m pytest tests_v3 -q --tb=short
      - run: python -m blum_v3.cli --database sqlite:////tmp/blum-v3-smoke.db status
      - name: Compile Python modules
        run: python -m compileall -q blum_v3
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --prefix web_v3 --ignore-scripts
      - name: Record generated dependency lock
        run: node -e "console.log('BLUM_WEB_LOCK_BEGIN'); console.log(require('fs').readFileSync('web_v3/package-lock.json').toString('base64')); console.log('BLUM_WEB_LOCK_END')"
      - run: npm --prefix web_v3 test
      - run: npm --prefix web_v3 run typecheck
      - run: npm --prefix web_v3 run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: blum-v3-web
          path: |
            web_v3/out
            web_v3/package-lock.json
